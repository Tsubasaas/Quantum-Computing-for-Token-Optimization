[project]
name = "taqumi2026s-teame"
version = "0.1.0"
description = "Quantum optimization project for real-world social problems"
readme = "README.md"
authors = [
    { name = "ShuichiMurayama", email = "shuichi.murayama@lt-s.jp" }
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.13.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "networkx>=3.3",
    "qiskit>=1.2.0",
    "qiskit-algorithms>=0.3.0",
    "qiskit-aer>=0.15.0",
    "qiskit-optimization>=0.6.0",
    "docplex>=2.27.239",
    "ipykernel>=6.29.0",
    "jupyterlab>=4.2.0",
    "streamlit>=1.63.0",
    "amplify>=1.6.3",
    "matplotlib-fontja>=1.1.0",
    "python-dotenv>=1.0.0",
    "openai>=1.40.0",
    "dwave-system>=1.30.0",
    "dwave-networkx>=0.8.18",
    "reportlab>=5.0.1",
]

[project.scripts]
taqumi2026s-teame = "taqumi2026s_teame:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["^app/"]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
